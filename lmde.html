<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lemonade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #0d0d0d;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.4s ease;
    }

    /* ---------- FANNING CAROUSEL ---------- */
    .stage {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 480px;
    }

    .slide {
      position: absolute;
      left: 0;
      top: 0;
      width: 190px;
      height: 190px;
      border-radius: 24px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 18px;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      user-select: none;
      will-change: transform, opacity;
    }

    .slide.wing {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .slide.active {
      border: 3px solid #ffffff;
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
    }

    /* game card with no cover art: black tile with the game name */
    .slide.titled {
      background: #000 !important;
      color: #fff;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px;
      text-align: center;
    }

    .enter-tip {
      position: fixed;
      z-index: 3;
      transform: translateX(-50%);
      background: #e8e8e8;
      color: #222;
      border-radius: 16px;
      padding: 6px 14px;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    .enter-tip.show {
      opacity: 1;
    }

    .enter-side {
      position: fixed;
      z-index: 3;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e8e8e8;
      color: #222;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      line-height: 1;
      padding-bottom: 3px;
      box-sizing: border-box;
      pointer-events: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    /* the down-arrow circle — always visible, hidden only while a game runs */
    .grid-dot {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e8e8e8;
      color: #222;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      line-height: 1;
      padding-bottom: 3px;
      box-sizing: border-box;
      pointer-events: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .game-overlay.show ~ .grid-dot {
      opacity: 0;
    }

    /* the whole ring tilts toward the cursor */
    .stage {
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
    }

    /* the hub the carousel spins around */
    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
      z-index: 0;
      pointer-events: none;
      animation: hubPulse 2s ease-in-out infinite;
    }

    .hub::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      animation: hubPing 1.8s ease-out infinite;
    }

    @keyframes hubPulse {
      0%, 100% { box-shadow: 0 0 12px rgba(255, 255, 255, 0.9); }
      50% { box-shadow: 0 0 26px rgba(255, 255, 255, 1.5); }
    }

    @keyframes hubPing {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(4.5); opacity: 0; }
    }

    .slide:nth-child(1) {
      background: linear-gradient(145deg, #ff6b9d, #c2185b);
    }
    .slide:nth-child(2) {
      background: linear-gradient(145deg, #a06bff, #512da8);
    }
    .slide:nth-child(3) {
      background: linear-gradient(145deg, #33e0ff, #00838f);
    }
    .slide:nth-child(4) {
      background: linear-gradient(145deg, #ffc14d, #ff5722);
    }
    .slide:nth-child(5) {
      background: linear-gradient(145deg, #69f0ae, #1b5e20);
    }
    .slide:nth-child(6) {
      background: linear-gradient(145deg, #40c4ff, #1a237e);
    }
    .slide:nth-child(7) {
      background: linear-gradient(145deg, #ff8a65, #bf360c);
    }
    .slide:nth-child(8) {
      background: linear-gradient(145deg, #f06292, #880e4f);
    }
    .slide:nth-child(9) {
      background: linear-gradient(145deg, #26c6da, #006064);
    }
    .slide:nth-child(10) {
      background: linear-gradient(145deg, #5c6bc0, #283593);
    }
    .slide:nth-child(11) {
      background: linear-gradient(145deg, #ffd54f, #ff8f00);
    }
    .slide:nth-child(12) {
      background: linear-gradient(145deg, #d4e157, #827717);
    }
    .slide:nth-child(13) {
      background: linear-gradient(145deg, #4dd0e1, #00695c);
    }
    .slide:nth-child(14) {
      background: linear-gradient(145deg, #7e57c2, #4a148c);
    }
    .slide:nth-child(15) {
      background: linear-gradient(145deg, #e57373, #b71c1c);
    }
    .slide:nth-child(16) {
      background: linear-gradient(145deg, #ffb300, #e65100);
    }
    .slide:nth-child(17) {
      background: linear-gradient(145deg, #66bb6a, #1b5e20)
    }
    .slide:nth-child(18) {
      background: linear-gradient(145deg, #b0bec5, #455a64);
    }

    /* half pill flush to the right edge */
    .pill {
      position: fixed;
      top: 12px;
      right: 0;
      z-index: 4;
      width: 170px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-right: none;
      border-radius: 18px 0 0 18px;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      color: #fff;
      text-align: center;
      user-select: none;
      overflow: hidden;
      transition: width 0.45s ease, border-radius 0.45s ease, box-shadow 0.45s ease;
    }

    .pill.open {
      width: 340px;
      border-radius: 18px 0 18px 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .pill .head {
      height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pill .time {
      font-size: 24px;
      letter-spacing: 2px;
      line-height: 1;
    }

    .cln {
      animation: clnBlink 1s steps(1) infinite;
    }

    @keyframes clnBlink {
      0%, 55% { opacity: 1; }
      56%, 100% { opacity: 0.25; }
    }

    .pill .day {
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .pill .extra {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s ease;
    }

    .pill.open .extra {
      grid-template-rows: 1fr;
    }

    .pill .extra-wrap {
      overflow: hidden;
    }

    .pill .extra-info {
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.7);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 16px 6px;
    }

    .pill .tabs {
      position: relative;
      display: flex;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .pill .wasd-band {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 11px 14px;
    }

    .pill .wasd-band .band-label {
      font-size: 8px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }

    .pill .wasd-band .wasd-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .pill .wasd-band .wkey {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e8e8e8;
      color: #1c1c1c;
      font-size: 7px;
      font-weight: 700;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .pill .wasd-band .wasd-row {
      display: flex;
      gap: 2px;
    }

    .pill .keykey {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e8e8e8;
      color: #1c1c1c;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0;
      user-select: none;
    }

    .pill .tab {
      flex: 1;
      text-align: center;
      padding: 10px 2px;
      font-size: 8px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.45);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      user-select: none;
      transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .pill .tab:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    .pill .tab.sel {
      color: #ffffff;
      border-bottom-color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .pill .pane {
      display: none;
    }

    .pill .pane.on {
      display: block;
      animation: paneIn 0.3s ease;
    }

    @keyframes paneIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: none; }
    }

    .pill .setting-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.7);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease, color 0.25s ease, background 0.25s ease;
    }

    .pill.open .setting-row {
      opacity: 1;
      transform: none;
      transition-delay: var(--d, 0s);
    }

    .pill .setting-row.sel {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .pill .setting-row label {
      width: 46px;
      text-align: left;
      flex: none;
    }

    .pill .setting-row input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: #ffffff;
      background: transparent;
    }

    .pill .setting-row span {
      width: 38px;
      text-align: right;
      color: #fff;
      flex: none;
    }

    .pill .setting-row input[type="checkbox"] {
      accent-color: #ffffff;
      width: 16px;
      height: 16px;
    }

    .pill .setting-row input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 10px;
      letter-spacing: 1px;
      padding: 6px 8px;
      outline: none;
    }

    .pill .setting-row input[type="text"]:focus {
      border-color: #ffffff;
    }

    .pill .setting-row button {
      flex: none;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 6px;
      font-size: 9px;
      letter-spacing: 2px;
      padding: 6px 10px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease;
    }

    .pill .setting-row button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .pill .btn-group {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .pill .setting-row button.wide {
      flex: 1;
      padding: 8px 0;
    }

    .pill .games-status {
      font-size: 8px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      padding: 10px 16px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .pill .swatches {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill .swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      padding: 0;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .pill .swatch.preset-dark {
      background: linear-gradient(145deg, #2a2a2a, #000);
    }

    .pill .swatch:hover {
      transform: scale(1.15);
    }

    .pill .swatch.sel {
      border-color: #ffffff;
    }

    /* keep the dotr circle clear of the expanded pill */
    .pill.open ~ .dotr {
      right: 352px;
    }

    /* light grey circle matching the pill, centred beside it */
    .dotr {
      position: fixed;
      top: 27px;
      right: 188px;
      z-index: 4;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      color: #222;
      user-select: none;
      transition: right 0.45s ease;
    }

    .tip-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 6px;
      margin-bottom: 7px;
      text-align: center;
    }

    .tip-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.7);
      padding: 3px 0;
      gap: 14px;
    }

    .tip-row b {
      color: #e8e8e8;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      padding: 1px 6px;
      font-weight: 700;
      font-size: 8px;
      letter-spacing: 1px;
      min-width: 42px;
      text-align: center;
    }

    /* embedded game overlay */
    .game-overlay {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: rgba(0, 0, 0, 0.9);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .game-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .game-overlay .frame {
      position: absolute;
      inset: 0;
      background: #0d0d0d;
      overflow: hidden;
      color: #fff;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
    }

    .game-overlay .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
    }

    .game-overlay .x {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: #000;
      color: #fff;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }

    .game-overlay .x:hover {
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.6);
      transform: rotate(90deg);
    }

    /* grid menu of all tiles */
    .grid-menu {
      position: fixed;
      inset: 0;
      z-index: 8;
      background: rgba(8, 8, 8, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .grid-menu.show {
      opacity: 1;
      pointer-events: auto;
    }

    .grid-menu .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 14px;
      width: min(860px, 90vw);
      max-height: 84vh;
      overflow: auto;
      padding: 20px;
    }

    .grid-menu .cell {
      position: relative;
      aspect-ratio: 1;
      border-radius: 16px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 10px;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .grid-menu .cell:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: #ffffff;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
    }

    .grid-menu .cell.sel {
      border-width: 3px;
      border-color: #ffffff;
    }

    .grid-menu .cell.cover.sel,
    .grid-menu .cell.local.sel {
      outline: 2px solid #ffffff;
      outline-offset: -5px;
    }

    .grid-menu .cell .cell-name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 1px;
      padding: 6px 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 0 0 16px 16px;
    }

    /* PC-added games: the card IS the name, black with white text */
    .grid-menu .cell.local {
      background: #000;
      border-color: rgba(255, 255, 255, 0.35);
      align-items: center;
      justify-content: center;
    }

    .grid-menu .cell.local .cell-name {
      position: static;
      overflow: visible;
      background: none;
      color: #fff;
      font-size: 11px;
      letter-spacing: 2px;
      padding: 10px;
      white-space: normal;
      text-overflow: clip;
    }

    .add-game {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 9;
      background: #e8e8e8;
      color: #1c1c1c;
      border: none;
      border-radius: 14px;
      padding: 10px 18px;
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    .add-game:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
    }

    /* splash screen shown on open */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      overflow: hidden;
      transition: opacity 0.9s ease, visibility 0s linear 0.9s;
    }

    .splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash::before {
      content: '';
      position: absolute;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0%, transparent 70%);
      filter: blur(6px);
    }

    .splash .im {
      position: relative;
      width: min(300px, 50vw);
      height: auto;
      filter: drop-shadow(0 0 48px rgba(255, 255, 255, 0.35));
      animation: splashPop 1s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
    }

    @keyframes splashPop {
      from { opacity: 0; transform: scale(0.8) translateY(18px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .splash .tag {
      font-family: 'Lilita One', 'Segoe UI', Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 8px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.5);
      user-select: none;
    }

    .splash .load {
      width: 180px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .splash .load::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #fff;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.8);
      animation: splashLoad 1.2s ease-in-out infinite;
    }

    @keyframes splashLoad {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }
  </style>
</head>
<body>

    <div class="enter-side" id="nextTip">&gt;</div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>

  <div class="pill" id="pill">
    <div class="head">
      <div class="time" id="pillTime">00:00</div>

    </div>
    <div class="extra">
<div class="extra-wrap">
          <div class="wasd-band">
            <span class="band-label">WASD NAV</span>
            <span class="wasd-cluster">
              <span class="wkey">W</span>
              <span class="wasd-row">
                <span class="wkey">A</span>
                <span class="wkey">S</span>
                <span class="wkey">D</span>
              </span>
            </span>
          </div>
          <div class="tabs">
            <div class="keykey">Q</div>
            <div class="tab sel" data-tab="0">CARDS</div>
            <div class="tab" data-tab="1">STYLE</div>

        <div class="pane pane-cards on">
          <div class="setting-row" style="--d:0.06s">
            <label>CARD</label>
            <input type="range" id="setCard" min="90" max="320" step="5" value="190">
            <span id="valCard">190</span>
          </div>
          <div class="setting-row" style="--d:0.13s">
            <label>ORBIT</label>
            <input type="range" id="setRadius" min="0.2" max="0.75" step="0.01" value="0.45">
            <span id="valRadius">0.45</span>
          </div>
          <div class="setting-row" style="--d:0.2s">
            <label>BOOST</label>
            <input type="range" id="setBoost" min="1" max="2.5" step="0.05" value="1.2">
            <span id="valBoost">1.2</span>
          </div>
        </div>
        <div class="pane pane-custom">
          <div class="setting-row" style="--d:0.06s">
            <label>PRESET</label>
            <div class="swatches" id="swatches"></div>
          </div>
          <div class="setting-row" style="--d:0.13s">
            <label>BG IMG</label>
            <input type="text" id="setImg" placeholder="image url">
            <button id="imgSet">SET</button>
          </div>
        </div>
        <div class="pane pane-games">
          <div class="setting-row" style="--d:0.06s">
            <label>FOLDER</label>
            <button id="importFolder" class="wide">IMPORT</button>

            <label>LIBRARY</label>

        </div>
      </div>
    </div>
  </div>
  <div class="dotr">↑</div>

  <div class="game-overlay" id="gameOverlay">
    <div class="frame" id="gameFrame"></div>
    <button class="x" id="gameClose">✕</button>
  </div>

  <div class="grid-menu" id="gridMenu">
    <button class="add-game" id="addGame">+ ADD GAME</button>
    <div class="grid" id="gridCells"></div>
  </div>
  <input type="file" id="gameFile" webkitdirectory multiple hidden>
  <div class="grid-dot">↓</div>

  <script>
    const stage = document.getElementById('stage');
    const slides = [...document.querySelectorAll('.slide')];
    const enterTip = document.getElementById('enterTip');
    const prevTip = document.getElementById('prevTip');
    const nextTip = document.getElementById('nextTip');
    const n = slides.length;
    const STEP = Math.PI / 4; // fixed 45deg spacing between neighbouring cards
    const CARD_W = 190;
    const CARD_H = 190;

    let pos = 0; // fractional index sitting at the front
    let active = 0;
    let animId = null;

    const cfg = {
      card: 190,     // base card size px
      radius: 0.45,  // orbit radius as fraction of stage width
      boost: 1.2,    // center-card size multiplier
      gradOn: false, // custom background gradient
      gradA: '#ff6b9d',
      gradB: '#c2185b',
      img: '',       // custom background image
    };

    const applyConfig = () => {
      slides.forEach(s => {
        s.style.width = cfg.card + 'px';
        s.style.height = cfg.card + 'px';
        s.style.borderRadius = (cfg.card * 0.126) + 'px';
      });
      draw();
    };

    const radius = () => Math.min(stage.clientWidth * cfg.radius, 470);
    const fround = x => Math.floor(x + 0.5);

    function pose(i) {
      const idx = i - pos;
      // rail carousel: only true neighbours (within 3.5 slots) are ever shown.
      // everything farther out belongs past the ends (or the wrap-around rear)
      // and must never draw — no cards popping in on the wrong side.
      if (Math.abs(idx) > 3.5) return { d: 0 };
      const t = idx * STEP;
      const c = Math.cos(t);
      const d = (c + 1) / 2; // 1 front, 0 behind
      const cx = stage.clientWidth / 2;
      const cy = stage.clientHeight / 2;
      const r = radius();
      return {
        x: cx + r * Math.sin(t),
        y: cy - 26 * (1 - d), // neighbours rise slightly off the center line
        s: (0.15 + 1.2 * d) * cfg.boost,
        d: d,
      };
    }

    function wrapTarget(i) {
      // clamp to a finite [0..n-1] range — the carousel has a start and an end
      return Math.max(0, Math.min(n - 1, i));
    }

    function draw() {
      slides.forEach((s, i) => {
        const p = pose(i);
        if (p.d < 0.06) {
          // slipped past the sides: gone behind the hub, never drawn
          s.classList.add('wing');
          return;
        }
        s.classList.remove('wing');
        const half = cfg.card / 2;
        s.style.transform =
          'translate(' + (p.x - half) + 'px, ' + (p.y - half) + 'px) scale(' + p.s + ')';
        s.style.opacity = 0.35 + 0.65 * p.d;
        s.style.zIndex = Math.round(p.d * 100);
        s.classList.toggle('active', i === active);
      });
      // ENTER tip is pinned to the carved-out center of the carousel
      // so it never drifts while the ring rotates; only the scale of the
      // centre card (boost) sizes the gap it sits in
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const baseHalf = (cfg.card / 2) * 1.35 * cfg.boost;
      const enterTop = (cy + baseHalf + 14) + 'px';
      enterTip.style.left = cx + 'px';
      enterTip.style.top = enterTop;
      enterTip.classList.add('show');
      const gap = 96;
      prevTip.style.left = (cx - gap) + 'px';
      prevTip.style.top = enterTop;
      nextTip.style.left = (cx + gap) + 'px';
      nextTip.style.top = enterTop;
    }

    function animateTo(target) {
      if (animId) cancelAnimationFrame(animId);
      const start = pos;
      const dist = target - start;
      const dur = 700;
      const t0 = performance.now();

      function frame(t) {
        const k = Math.min((t - t0) / dur, 1);
        const e = 1 - Math.pow(1 - k, 3); // ease-out
        pos = start + dist * e;
        active = Math.max(0, Math.min(n - 1, fround(pos)));
        draw();
        if (k < 1) {
          animId = requestAnimationFrame(frame);
        } else {
          animId = null;
          pos = target;
          active = Math.max(0, Math.min(n - 1, fround(pos)));
          draw();
        }
      }
      animId = requestAnimationFrame(frame);
    }

    const next = () => animateTo(Math.min(n - 1, fround(pos) + 1));
    const prev = () => animateTo(Math.max(0, fround(pos) - 1));

    const gameOverlay = document.getElementById('gameOverlay');
    const gameFrame = document.getElementById('gameFrame');
    const gameClose = document.getElementById('gameClose');

    // native timers we wrap while the game runs so we can fully tear it down
    const nSI = window.setInterval.bind(window);
    const nCI = window.clearInterval.bind(window);
    const nST = window.setTimeout.bind(window);
    const nCT = window.clearTimeout.bind(window);
    const nRAF = window.requestAnimationFrame.bind(window);
    const nCAF = window.cancelAnimationFrame.bind(window);
    let tracking = null;

    const stopGame = () => {
      if (tracking) {
        tracking.intervals.forEach(id => nCI(id));
        tracking.timeouts.forEach(id => nCT(id));
        tracking.raf.forEach(id => nCAF(id));
        tracking = null;
      }
      window.setInterval = nSI;
      window.clearInterval = nCI;
      window.setTimeout = nST;
      window.clearTimeout = nCT;
      window.requestAnimationFrame = nRAF;
      window.cancelAnimationFrame = nCAF;
      // close every audio context the game opened so music stops dead
      if (window.AudioContext && AudioContext.getContexts) {
        AudioContext.getContexts().forEach(c => c.close());
      }
    };

    const gameStart = () => {
      if (tracking) stopGame();
      tracking = { intervals: new Set(), timeouts: new Set(), raf: new Set() };
      window.setInterval = (fn, ms, ...a) => {
        const id = nSI(fn, ms, ...a);
        tracking.intervals.add(id);
        return id;
      };
      window.setTimeout = (fn, ms, ...a) => {
        const id = nST(fn, ms, ...a);
        tracking.timeouts.add(id);
        return id;
      };
      window.requestAnimationFrame = fn => {
        const id = nRAF(fn);
        tracking.raf.add(id);
        return id;
      };
      gameOverlay.classList.add('show');
      gameFrame.innerHTML = '<div class="loading">LOADING</div>';
    };

    // open a saved game that occupies a carousel card
    const gameOpen = () => {
      const g = games[active];
      if (!g) return;
      gridClose();
      gameStart();
      injectHtml(g.html);
    };

    // ————— folder import + live library —————
    const readTextFile = f => new Promise(res => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.readAsText(f);
    });
    const readImgFile = f => new Promise(res => {
      if (!f) return res(null);
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.readAsDataURL(f);
    });

    const fileEntries = files => {
      const list = [...files];
      const htmlFiles = list.filter(f => /\.html?$/i.test(f.name));
      return Promise.all(htmlFiles.map(f => {
        const base = f.name.replace(/\.html?$/i, '');
        const img = list.find(x =>
          x !== f &&
          x.name.replace(/\.[^.]+$/, '').toLowerCase() === base.toLowerCase() &&
          /\.(png|jpe?g|gif|webp)$/i.test(x.name)
        );
        return Promise.all([readTextFile(f), readImgFile(img)])
          .then(([html, data]) => ({ name: base, html, img: data }));
      }));
    };

    const gameStatus = () => {
      const count = games.filter(Boolean).length;
      return count ? count + ' GAME' + (count > 1 ? 'S' : '') : 'NO GAMES';
    };

    const setGamesFrom = entries => {
      const sorted = entries.slice().sort((a, b) => a.name.localeCompare(b.name));
      games = new Array(n).fill(null);
      sorted.slice(0, n).forEach((g, i) => { games[i] = g; });
      saveGames();
      refreshSlideGames();
      buildGrid();
      gamesStatus.textContent = gameStatus();
    };

    const importFromFiles = files => {
      gridClose();
      fileEntries(files).then(entries => {
        setGamesFrom(entries);
        if (!entries.length) gamesStatus.textContent = 'NO GAMES IN FOLDER';
      });
    };

    // one-time scan; the library is saved and reloaded with the page
    const scanDir = dir => {
      (async () => {
        try {
          const list = [];
          for await (const entry of dir.values()) {
            if (entry.kind !== 'file') continue;
            list.push(await entry.getFile());
          }
          const entries = await fileEntries(list);
          setGamesFrom(entries);
        } catch (e) { /* folder gone or revoked */ }
      })();
    };

    const pickFolder = async () => {
      gridClose();
      if (window.showDirectoryPicker) {
        try {
          const dir = await window.showDirectoryPicker();
          scanDir(dir);
          return;
        } catch (e) { return; } // user cancelled
      }
      gameFile.click();
    };

    const gameFile = document.getElementById('gameFile');
    const addGameBtn = document.getElementById('addGame');
    const importFolderBtn = document.getElementById('importFolder');
    const clearGamesBtn = document.getElementById('clearGames');
    const gamesStatus = document.getElementById('gamesStatus');
    addGameBtn.addEventListener('click', pickFolder);
    importFolderBtn.addEventListener('click', pickFolder);
    clearGamesBtn.addEventListener('click', () => {
      games = new Array(n).fill(null);
      saveGames();
      refreshSlideGames();
      buildGrid();
      gamesStatus.textContent = 'NO FOLDER ›';
    });
    gameFile.addEventListener('change', () => {
      if (gameFile.files.length) importFromFiles(gameFile.files);
      gameFile.value = '';
    });

    const injectHtml = html => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const bodyHtml = doc.body ? doc.body.innerHTML : html;
      const styles = [...doc.querySelectorAll('style, link[rel="stylesheet"]')];
      const scripts = [...doc.querySelectorAll('script')];
      gameFrame.innerHTML = bodyHtml;
      styles.forEach(st => {
        const s = document.createElement('style');
        s.textContent = st.textContent || st.innerHTML || '';
        gameFrame.appendChild(s);
      });
      scripts.forEach(sc => {
        const s = document.createElement('script');
        if (sc.src) s.src = sc.src;
        else s.textContent = sc.textContent;
        gameFrame.appendChild(s);
      });
    };
    const gameCloseAll = () => {
      stopGame();
      gameFrame.innerHTML = '';
      gameOverlay.classList.remove('show');
    };
    const gameHidden = () => gameOverlay.classList.contains('show');
    gameClose.addEventListener('click', gameCloseAll);

    // grid menu of every tile
    const gridMenu = document.getElementById('gridMenu');
    const gridCells = document.getElementById('gridCells');
    let gridIdx = -1;
    const gridCols = () => {
      const n = getComputedStyle(gridCells).gridTemplateColumns.split(' ').filter(Boolean).length;
      return n || 6;
    };
    const gridSelect = i => {
      const cells = gridCells.children;
      if (gridIdx >= 0 && gridIdx < cells.length) cells[gridIdx].classList.remove('sel');
      gridIdx = i;
      if (i < 0 || i >= cells.length) return;
      cells[i].classList.add('sel');
    };
    const gridOpen = () => {
      gridMenu.classList.add('show');
      gridSelect(active);
    };
    const gridClose = () => {
      gridMenu.classList.remove('show');
      gridSelect(-1);
    };
    const gridHidden = () => gridMenu.classList.contains('show');

    // one game per carousel card; empty slots are plain covers
    let games = new Array(n).fill(null);
    const saveGames = () => {
      try { localStorage.setItem('caroGames', JSON.stringify(games)); } catch (e) { /* full */ }
    };

    const buildGrid = () => {
      gridCells.textContent = '';
      slides.forEach((s, i) => {
        const c = document.createElement('div');
        c.className = 'cell';
        const g = games[i];
        const click = () => {
          gridClose();
          animateTo(wrapTarget(i));
        };
        if (g) {
          if (g.img) {
            c.classList.add('cover');
            c.style.background = 'url("' + g.img + '") center/cover no-repeat';
          } else {
            c.classList.add('local');
            const name = document.createElement('span');
            name.className = 'cell-name';
            name.textContent = g.name;
            c.appendChild(name);
          }
          c.title = g.name;
          c.addEventListener('click', () => {
            click();
            gameStart();
            injectHtml(g.html);
          });
        } else {
          c.addEventListener('click', click);
        }
        gridCells.appendChild(c);
      });
    };

    // put cover art on the carousel tiles that have an image
    const refreshSlideGames = () => {
      slides.forEach((s, i) => {
        const g = games[i];
        if (g && g.img) {
          s.classList.remove('titled');
          s.style.background = 'url("' + g.img + '") center/cover no-repeat';
          s.textContent = '';
        } else if (g) {
          s.classList.add('titled');
          s.style.background = '#000';
          s.textContent = g.name;
        } else {
          s.classList.remove('titled');
          s.style.background = 'transparent';
          s.textContent = '';
        }
      });
    };
    try {
      const saved = localStorage.getItem('caroGames');
      if (saved) games = JSON.parse(saved);
      if (!Array.isArray(games)) games = new Array(n).fill(null);
      while (games.length < n) games.push(null);
    } catch (e) { /* ignore */ }
    buildGrid();
    refreshSlideGames();
    gamesStatus.textContent = gameStatus();

    slides.forEach((s) => {
      s.style.cursor = 'default';
    });

    window.addEventListener('resize', draw);

    // live clock in the top-right half pill
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    function tickClock() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      document.getElementById('pillTime').innerHTML =
        hh + '<span class="cln">:</span>' + mm;
      document.getElementById('pillDay').textContent = days[d.getDay()];
    }
    tickClock();
    setInterval(tickClock, 1000);

    // UI controls — everything reachable with the keyboard
    const tabBtns = [...document.querySelectorAll('.tab')];
    const paneRows = {
      0: [...document.querySelectorAll('.pane-cards .setting-row')],
      1: [...document.querySelectorAll('.pane-custom .setting-row')],
      2: [...document.querySelectorAll('.pane-games .setting-row')],
    };
    const TABS = 3;
    let curTab = 0;
    let uiIndex = 0;

    const tabRows = () => paneRows[curTab];
    const itemCount = () => tabRows().length;

    function refreshSelection() {
      tabBtns.forEach((t, j) => t.classList.toggle('sel', j === curTab));
      tabRows().forEach((r, j) => r.classList.toggle('sel', uiIndex === j));
    }

    function selectRow(i) {
      uiIndex = Math.max(0, Math.min(itemCount() - 1, i));
      refreshSelection();
    }

    function switchTab(t) {
      curTab = ((t % TABS) + TABS) % TABS;
      tabBtns.forEach((b, j) => b.classList.toggle('sel', j === curTab));
      document.querySelector('.pane-cards').classList.toggle('on', curTab === 0);
      document.querySelector('.pane-custom').classList.toggle('on', curTab === 1);
      document.querySelector('.pane-games').classList.toggle('on', curTab === 2);
      selectRow(uiIndex);
    }

    function adjustUI(delta) {
      // A/D edit the focused row only — they never move focus
      const j = uiIndex;
      if (curTab === 0) {
        if (j === 0) {
          setCard.value = Math.max(90, Math.min(320, Number(setCard.value) + 5 * delta));
          setCard.dispatchEvent(new Event('input'));
        } else if (j === 1) {
          setRadius.value = Math.max(0.2, Math.min(0.75, Number(setRadius.value) + 0.01 * delta));
          setRadius.dispatchEvent(new Event('input'));
        } else {
          setBoost.value = Math.max(1, Math.min(2.5, Number(setBoost.value) + 0.05 * delta));
          setBoost.dispatchEvent(new Event('input'));
        }
      } else if (curTab === 1 && j === 0) {
        presetGo(presetIdx + delta);
      }
    }

    const activate = () => {
      const j = uiIndex;
      if (curTab === 1 && j === 1) setImg.focus();
      if (curTab === 2 && j === 0) importFolderBtn.click();
      if (curTab === 2 && j === 1) clearGamesBtn.click();
    };

    tabBtns.forEach((b, j) => b.addEventListener('click', () => switchTab(j)));

    window.addEventListener('keydown', e => {
      // splash screen: ignore all input until it finishes on its own
      if (!splashDone) return;
      // game open: only Escape closes it
      if (gameHidden()) {
        if (e.key === 'Escape') gameCloseAll();
        return;
      }
      // grid menu open: WASD to move, Enter to enter, Escape to close
      if (gridHidden()) {
        if (e.key === 'Escape' || e.key === 'ArrowDown') { gridClose(); return; }
        const cells = gridCells.children;
        if (!cells.length) return;
        const cols = gridCols();
        const total = cells.length;
        const rows = Math.ceil(total / cols);
        let idx = gridIdx < 0 ? 0 : gridIdx;
        let row = Math.floor(idx / cols);
        let col = idx % cols;
        if (e.key === 'w' || e.key === 'W') row -= 1;
        else if (e.key === 's' || e.key === 'S') row += 1;
        else if (e.key === 'a' || e.key === 'A') col -= 1;
        else if (e.key === 'd' || e.key === 'D') col += 1;
        else if (e.key === 'Enter') {
          if (gridIdx >= 0 && cells[gridIdx]) cells[gridIdx].click();
          return;
        } else {
          return;
        }
        if (col < 0) { if (row > 0) { row -= 1; col = cols - 1; } else col = 0; }
        if (col >= cols) col = 0;
        row = Math.max(0, Math.min(rows - 1, row));
        idx = Math.min(total - 1, row * cols + col);
        gridSelect(idx);
        return;
      }
      // up arrow expands / collapses the settings pill
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        document.getElementById('pill').classList.toggle('open');
        return;
      }
      // arrows steer the carousel
      if (e.key === 'ArrowRight') { next(); return; }
      if (e.key === 'ArrowLeft') { prev(); return; }
      // down arrow pops the tile grid menu
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        gridOpen();
        return;
      }
      // settings keys only work while the pill is expanded
      const pillOpen = document.getElementById('pill').classList.contains('open');
      if (pillOpen) {
        // WASD + space drive the settings UI
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          activate();
          return;
        }
        // W/S walk down through tabs + rows
        if (e.key === 'w' || e.key === 'W') { selectRow(uiIndex - 1); return; }
        if (e.key === 's' || e.key === 'S') { selectRow(uiIndex + 1); return; }
        // A/D edit the focused row
        if (e.key === 'a' || e.key === 'A') { adjustUI(-1); return; }
        if (e.key === 'd' || e.key === 'D') { adjustUI(1); return; }
        // Q/E switch tabs
        if (e.key === 'q' || e.key === 'Q') { switchTab(curTab - 1); return; }
        if (e.key === 'e' || e.key === 'E') { switchTab(curTab + 1); return; }
      }
      // Enter only applies a typed image URL or launches the card game;
      // it never activates anything inside the settings
      if (e.key === 'Enter') {
        e.preventDefault();
        if (document.activeElement === setImg) {
          applyImg();
          setImg.blur();
        } else if (curTab === 0) {
          gameOpen();
        }
        return;
      }
    });

    // settings sliders live inside the expanded pill
    const setCard = document.getElementById('setCard');
    const setRadius = document.getElementById('setRadius');
    const setBoost = document.getElementById('setBoost');
    const setImg = document.getElementById('setImg');
    const imgSet = document.getElementById('imgSet');

    // custom wallpaper: a preset gradient, an image, or the dark default
    function applyBg() {
      let bg = '';
      if (cfg.img) bg = 'url("' + cfg.img + '") center/cover no-repeat';
      else if (cfg.gradOn) bg = 'linear-gradient(145deg, ' + cfg.gradA + ', ' + cfg.gradB + ')';
      document.body.style.background = bg;
    }

    const PRESETS = [
      { dark: true },
      { a: '#ff6b9d', b: '#c2185b' },
      { a: '#a06bff', b: '#512da8' },
      { a: '#33e0ff', b: '#00838f' },
      { a: '#ffc14d', b: '#ff5722' },
      { a: '#69f0ae', b: '#1b5e20' },
      { a: '#40c4ff', b: '#1a237e' },
      { a: '#ffd54f', b: '#ff8f00' },
      { a: '#26c6da', b: '#006064' },
      { a: '#e57373', b: '#b71c1c' },
      { a: '#b0bec5', b: '#455a64' },
    ];
    let presetIdx = 0;

    function presetGo(i) {
      presetIdx = ((i % PRESETS.length) + PRESETS.length) % PRESETS.length;
      const p = PRESETS[presetIdx];
      if (p.dark) {
        cfg.gradOn = false;
      } else {
        cfg.gradOn = true;
        cfg.gradA = p.a;
        cfg.gradB = p.b;
      }
      cfg.img = '';
      setImg.value = '';
      document.querySelectorAll('.swatch').forEach((w, j) => w.classList.toggle('sel', j === presetIdx));
      applyBg();
      saveSettings();
    }

    const applyImg = () => {
      cfg.img = setImg.value.trim();
      cfg.gradOn = false;
      document.querySelectorAll('.swatch').forEach((w, j) => w.classList.toggle('sel', j === presetIdx && !cfg.img));
      applyBg();
      saveSettings();
    };

    // build the preset swatches
    (function buildSwatches() {
      const box = document.getElementById('swatches');
      PRESETS.forEach((p, i) => {
        const w = document.createElement('button');
        w.type = 'button';
        w.className = 'swatch' + (p.dark ? ' preset-dark' : '');
        w.style.background = p.dark
          ? null
          : 'linear-gradient(145deg, ' + p.a + ', ' + p.b + ')';
        w.title = p.dark ? 'Dark' : p.a + ' → ' + p.b;
        w.addEventListener('click', () => presetGo(i));
        box.appendChild(w);
      });
    })();

    const readSettings = () => {
      cfg.card = Number(setCard.value);
      cfg.radius = Number(setRadius.value);
      cfg.boost = Number(setBoost.value);
      document.getElementById('valCard').textContent = cfg.card;
      document.getElementById('valRadius').textContent = cfg.radius.toFixed(2);
      document.getElementById('valBoost').textContent = cfg.boost.toFixed(2);
      applyBg();
      applyConfig();
      saveSettings();
    };

    const SAVE_KEY = 'caroSettings';

    const saveSettings = () => {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          card: cfg.card,
          radius: cfg.radius,
          boost: cfg.boost,
          gradOn: cfg.gradOn,
          gradA: cfg.gradA,
          gradB: cfg.gradB,
          img: cfg.img,
          presetIdx: presetIdx,
        }));
      } catch (e) { /* storage unavailable */ }
    };

    const markSwatch = () => {
      let idx = 0;
      if (cfg.gradOn) {
        idx = PRESETS.findIndex(p => !p.dark && p.a === cfg.gradA && p.b === cfg.gradB);
        if (idx < 0) idx = 0;
      }
      presetIdx = idx;
      document.querySelectorAll('.swatch').forEach((w, j) => w.classList.toggle('sel', j === idx && cfg.gradOn));
    };

    const loadSettings = () => {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;
        const s = JSON.parse(raw);
        cfg.card = Number(s.card) || 190;
        cfg.radius = Number(s.radius) || 0.45;
        cfg.boost = Number(s.boost) || 1.2;
        cfg.gradOn = !!s.gradOn;
        cfg.gradA = s.gradA || cfg.gradA;
        cfg.gradB = s.gradB || cfg.gradB;
        cfg.img = s.img || '';
        presetIdx = Number(s.presetIdx) || 0;
        setCard.value = cfg.card;
        setRadius.value = cfg.radius;
        setBoost.value = cfg.boost;
        setImg.value = cfg.img;
        markSwatch();
        return true;
      } catch (e) {
        return false;
      }
    };

    [setCard, setRadius, setBoost].forEach(s => {
      s.addEventListener('input', readSettings);
    });
    imgSet.addEventListener('click', applyImg);

    if (!loadSettings()) presetGo(0); // dark is the default wallpaper
    readSettings();

    selectRow(0);

    // the whole ring tilts toward the cursor
    window.addEventListener('mousemove', e => {
      const x = e.clientX / window.innerWidth - 0.5;
      const y = e.clientY / window.innerHeight - 0.5;
      stage.style.transform = 'rotateY(' + (x * 6).toFixed(2) + 'deg) rotateX(' + (-y * 6).toFixed(2) + 'deg)';
    });

    applyConfig();

    // splash screen: always lasts 2.4s, input is ignored until it hides
    const splash = document.getElementById('splash');
    let splashDone = false;
    setTimeout(() => {
      splashDone = true;
      splash.classList.add('hide');
    }, 2400);
  </script>
</body>
</html>
